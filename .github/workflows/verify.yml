name: Verify source

on:
  push:
    branches: [main]
    paths-ignore: [data/state.json]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -B -m unittest discover -s tests -v
      - run: python tools/audit_public.py
      - run: node --test scheduler/worker.test.mjs
